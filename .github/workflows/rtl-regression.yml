name: RTL regression

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install simulator and Python environment
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator g++ make python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
      - name: Run complete RTL regression
        run: .venv/bin/python scripts/run_regression.py
      - name: Upload reports and failure replay
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rtl-evidence-${{ matrix.os }}
          path: |
            build/reports/
            build/failures/
            build/b_fixtures/
            build/probes/
          if-no-files-found: warn
          retention-days: 14
